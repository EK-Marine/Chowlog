<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e3b2c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ChowLog</title>
<style>
:root{
  --field:#2e3b2c; --field-2:#3d4c3a; --paper:#eceee7; --card:#fbfcf8; --ink:#1b211b; --mute:#626b61;
  --line:#d6dad0; --coyote:#b08a52; --signal:#d4622a; --ok:#4f7a4a;
  --kp:#3f6e9e; --kc:#b08a52; --kf:#8b5f8f; --chip:#e1e4da; --headink:#eef0ea;
  --r-sm:8px; --r-lg:14px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color:var(--ink); background:var(--paper);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131712; --card:#1c211b; --ink:#e6e9e1; --mute:#98a194; --line:#2c332a; --chip:#262d24;
    --field:#1f281e; --field-2:#2c3829;
  }
}
:root[data-theme="dark"]{
  --paper:#131712; --card:#1c211b; --ink:#e6e9e1; --mute:#98a194; --line:#2c332a; --chip:#262d24;
  --field:#1f281e; --field-2:#2c3829;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--coyote);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--field);color:var(--headink);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;gap:8px}
#dateLabel{flex:1;font-weight:700;font-size:18px}
#netBadge{position:absolute;right:12px;bottom:-26px;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--mute)}
#netBadge.off{background:var(--signal);color:#fff}
#netBadge:empty{display:none}

main{padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 88px);max-width:560px;margin:0 auto}
.tab{display:none}.tab.active{display:block}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;color:var(--mute);font-weight:600;margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:12px}

/* Daily gauge — the one bold element */
.gauge{background:var(--field);color:var(--headink);border:0;padding:18px 16px 16px}
.gauge .num{font-size:52px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1}
.gauge .num.over{color:#f2a37a}
.gauge .lbl{font-size:15px;opacity:.85;margin-left:6px}
.gauge .sub{font-size:13px;opacity:.7;margin:6px 0 14px}
.segs{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-bottom:16px}
.segs i{height:14px;border-radius:2px;background:var(--field-2)}
.segs i.on{background:var(--coyote)}
.segs i.ov{background:var(--signal)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mac small{display:block;font-size:12px;opacity:.75}
.mac b{font-size:17px;font-variant-numeric:tabular-nums}
.mac b span{font-weight:400;opacity:.65;font-size:13px}
.mbar{height:5px;border-radius:3px;background:var(--field-2);margin-top:5px;overflow:hidden}
.mbar i{display:block;height:100%}
.k-p{background:#7fa9d6}.k-c{background:var(--coyote)}.k-f{background:#c39ac7}
.mbar.over i{background:var(--signal)}

.cal{padding:10px 8px 6px}
.cal-mh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px}
.cal-mh b{font-size:16px}
.cal-ttl{text-align:center;line-height:1.2}.cal-ttl small{display:block;font-size:12px;color:var(--mute)}
.cal-nav{background:none;border:0;font-size:22px;width:40px;height:36px;border-radius:50%}
.cal-nav:disabled{opacity:.25}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-wd{font-size:11px;color:var(--mute);padding:2px 0 4px}
.cal-d{background:none;border:0;border-radius:10px;padding:6px 0 5px;min-height:46px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cal-d b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.cal-d.today b{color:var(--coyote)}
.cal-d.sel{background:var(--field);color:var(--headink)}
.cal-d.sel.today b{color:var(--headink)}
.cal-d.out{opacity:.4}
.cal-d:disabled{opacity:.22;cursor:default}
.cal-d i{width:8px;height:8px;border-radius:50%}
.cal-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 0;font-size:12px;color:var(--mute)}
.cal-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 0 8px}
.meal{padding:6px 0 4px}
.mh{display:flex;align-items:center;gap:8px;padding:8px 14px}
.mh b{flex:1;font-size:16px}
.mh span{color:var(--mute);font-variant-numeric:tabular-nums;font-size:14px}
.mini{background:var(--chip);border:0;border-radius:20px;padding:5px 12px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.when{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-bottom:4px}
.when-note{font-size:13px;color:var(--signal);margin:-4px 4px 10px}
.tab > .row{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px}
.tab > .swipe{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:6px}
.tab > .swipe > .row{border-top:0}
.swipe{position:relative;overflow:hidden;touch-action:pan-y}
.swipe-bg{position:absolute;inset:0;background:var(--signal);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;font-weight:700;opacity:.7}
.swipe.arm .swipe-bg{opacity:1}
.swipe > .row{position:relative;background:var(--card)}
.row{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row img{pointer-events:none}
.row.pressing{background:var(--chip);transition:background .3s}
h3.hrow{display:flex;align-items:center;justify-content:space-between}
.btns.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);background:var(--paper);padding:8px 0}
.row img,.row .ic{width:42px;height:42px;border-radius:var(--r-sm);object-fit:cover;flex:none}
.row .ic{background:var(--chip);display:grid;place-items:center;font-size:18px;color:var(--mute)}
.rm{flex:1;min-width:0}
.rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.rd{font-size:13px;color:var(--mute)}
.rc{font-weight:700;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--mute);font-size:16px;padding:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px}
.tag.pend{background:var(--chip);color:var(--mute)}
.tag.err{background:var(--signal);color:#fff}
.empty{color:var(--mute);font-size:14px;padding:10px 14px}
.link{background:none;border:0;color:var(--coyote);font-size:14px;padding:8px 14px;font-weight:600}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--field);color:var(--headink);border-color:var(--field)}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:650}
.act span{font-size:26px;line-height:1.2}
.act small{font-weight:400;color:var(--mute);font-size:12px}
.act.primary-act{background:var(--field);color:var(--headink);border-color:var(--field)}
.act.wide{grid-column:1 / -1;flex-direction:row;justify-content:center;gap:10px;padding:12px}
.act.wide span{font-size:20px}
.fr{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.fr button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:5px 11px;font-size:14px;min-width:38px}
.pimg{width:88px;height:88px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line);float:right;margin:0 0 8px 10px}
.row img{background:#fff}
.srow{display:flex;gap:8px;margin-bottom:6px}.srow input{flex:1;margin:0}
.srow button{padding:0 16px;border-radius:var(--r-sm);border:0;background:var(--field);color:var(--headink);font-weight:600}
.tin{display:flex;gap:6px;margin-top:4px}.tin input{flex:1;margin:0}.tin select{width:auto;margin:0}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.act.primary-act small{color:var(--headink);opacity:.7}

.chart{width:100%;height:auto;display:block}
.b-ok{fill:var(--coyote)}.b-over{fill:var(--signal)}.b-p{fill:var(--kp)}
.tline{stroke:var(--ink);stroke-dasharray:4 3;stroke-width:1;opacity:.5}
.tlab{font-size:10px;fill:var(--mute)}
.wline{fill:none;stroke:var(--kp);stroke-width:2.5;stroke-linejoin:round}
.wdot{fill:var(--kp)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat b span{font-size:13px;font-weight:400;color:var(--mute)}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ctitle b{font-size:16px}.ctitle span{color:var(--mute);font-size:13px}

label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:70px;resize:vertical}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}
label.chk input{width:auto;margin:0}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns button{flex:1;min-width:90px;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);font-weight:600}
.btns .primary{background:var(--field);color:var(--headink);border-color:var(--field)}
.btns .danger{color:var(--signal)}
.hint{font-size:13px;color:var(--mute);margin:6px 0 10px}
.errbox{background:var(--signal);color:#fff;padding:10px;border-radius:var(--r-sm);font-size:14px}
.prev{width:100%;max-height:220px;object-fit:cover;border-radius:var(--r-sm);margin-bottom:10px}
.items{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;margin-bottom:12px}
.irow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px solid var(--line)}
.irow:last-of-type{border-bottom:0}
.tot{font-weight:650;margin:4px 0}
.cam{position:relative;border-radius:var(--r-sm);overflow:hidden;background:#000;margin-bottom:12px;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:2px solid var(--coyote);border-radius:6px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabbar button{background:none;border:0;padding:6px 0;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:20px;line-height:1}
.tabbar button.on{color:var(--ink);font-weight:650}

.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
#toast.act{pointer-events:auto}
#toast button{background:none;border:0;color:var(--coyote);font-weight:700;margin-left:10px;padding:2px 4px}
</style>
</head>
<body>
<header class="top">
  <div id="dateLabel"></div>
  <span id="netBadge"></span>
</header>
<main>
  <section id="tab-today" class="tab active"></section>
  <section id="tab-add" class="tab"></section>
  <section id="tab-trends" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
</main>
<nav class="tabbar">
  <button data-tab="today" class="on"><span>◐</span>Today</button>
  <button data-tab="add"><span>＋</span>Log food</button>
  <button data-tab="trends"><span>▤</span>Trends</button>
  <button data-tab="settings"><span>⚙</span>Settings</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galleryInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = x => { const n = parseFloat(x); return isFinite(n) ? n : 0; };
const r0 = n => Math.round(num(n));
const r1 = n => Math.round(num(n) * 10) / 10;
function ymd(d){ const z = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
const todayStr = () => ymd(new Date());
function addDays(s, n){ const [y,m,d] = s.split('-').map(Number); return ymd(new Date(y, m-1, d+n)); }
function dnum(s){ const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d) / 864e5; }
function shortD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
const hhmm = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
// Times are typed as 24-hour digits (0715, 1930) with the number keypad.
// Time format chosen in Settings: '12' (7:15 PM) or '24' (19:15).
function is24(){ return S.timeFmt === '24'; }
function timeInput(id, label, t){
  const [H, M] = t.split(':').map(Number), mm = String(M).padStart(2,'0');
  if (is24()) return `<label>${label} (24-hr)<input id="${id}" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="e.g. 1930" value="${String(H).padStart(2,'0')}${mm}"></label>`;
  return `<label>${label}<span class="tin"><input id="${id}" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="e.g. 715" value="${H % 12 || 12}:${mm}">
    <select id="${id}_ap" aria-label="AM or PM"><option ${H < 12 ? 'selected' : ''}>AM</option><option ${H >= 12 ? 'selected' : ''}>PM</option></select></span></label>`;
}
// Reads a time field → 'HH:MM', '' if empty, or null if invalid. In 12-hour mode, hours over 12 are taken as 24-hour.
function readTime(id){
  const raw = $('#' + id).value.trim(); if (!raw) return '';
  const t = parseTime(raw); if (!t || is24() || !$('#' + id + '_ap')) return t;
  let [H, M] = t.split(':').map(Number); if (H > 12) return t; if (H === 0) return null;
  H = H % 12 + ($('#' + id + '_ap').value === 'PM' ? 12 : 0);
  return String(H).padStart(2,'0') + ':' + String(M).padStart(2,'0');
}
const timeHint = () => is24() ? 'Enter a time like 0715 or 1930' : 'Enter a time like 7:15';
function parseTime(s){
  const d = String(s || '').replace(/\D/g, ''); if (!d || d.length > 4) return null;
  const H = d.length <= 2 ? +d : +d.slice(0, d.length - 2), M = d.length <= 2 ? 0 : +d.slice(-2);
  return H < 24 && M < 60 ? String(H).padStart(2,'0') + ':' + String(M).padStart(2,'0') : null;
}
const entTime = e => e.time || hhmm(new Date(e.ts));
function tsOf(date, time){ const [y,m,d] = date.split('-').map(Number), [H,M] = (time || '12:00').split(':').map(Number); return new Date(y, m-1, d, H, M).getTime(); }
function fmtTime(t){ const [H,M] = t.split(':').map(Number); return is24() ? String(H).padStart(2,'0') + ':' + String(M).padStart(2,'0') : new Date(2000,0,1,H,M).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
const byTime = (a,b) => (tsOf(a.date, entTime(a)) - tsOf(b.date, entTime(b))) || ((a.created || a.ts) - (b.created || b.ts));
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && s <= todayStr();
function totals(list){ return list.reduce((t,e) => ({cal:t.cal+num(e.cal), p:t.p+num(e.p), c:t.c+num(e.c), f:t.f+num(e.f)}), {cal:0,p:0,c:0,f:0}); }

/* amounts: fractions, units */
const FRAC = {'¼':'1/4','½':'1/2','¾':'3/4','⅓':'1/3','⅔':'2/3','⅛':'1/8'};
function parseAmt(s){
  s = String(s ?? '').trim().replace(/[¼½¾⅓⅔⅛]/g, m => ' ' + FRAC[m]).trim();
  const m = s.match(/^(\d+(?:\.\d+)?)?\s*(?:(\d+)\s*\/\s*(\d+))?$/);
  if (!m || (!m[1] && !m[2])) return NaN;
  let v = m[1] ? parseFloat(m[1]) : 0;
  if (m[2]) { if (+m[3] === 0) return NaN; v += +m[2] / +m[3]; }
  return v;
}
function fmtAmt(v){
  const w = Math.floor(v + 1e-9), fr = v - w;
  const g = [[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[1/2,'½'],[2/3,'⅔'],[3/4,'¾'],[1,'']].find(([x]) => Math.abs(fr - x) < 0.01);
  if (g) return g[0] === 1 ? String(w + 1) : (w ? w : '') + g[1] || '0';
  return String(Math.round(v * 100) / 100);
}
const amtInput = (id, label, val = '1') => `<label>${label}<input id="${id}" inputmode="decimal" autocomplete="off" value="${val}"></label>`;
const fracChips = id => `<div class="fr" data-for="${id}">${['¼','⅓','½','⅔','¾','1','1½','2'].map(x => `<button type="button" data-act="frac" data-v="${x}">${x}</button>`).join('')}</div>`;
const amtOf = id => { const v = parseAmt($('#' + id).value); return v > 0 ? v : NaN; };
const UNITS = {serving:{l:'servings'}, g:{l:'g', f:1}, oz:{l:'oz', f:28.3495}, lb:{l:'lb', f:453.592}, ml:{l:'ml', f:1}, floz:{l:'fl oz', f:29.5735}};
function unitsFor(p){ return !p.size ? ['serving'] : p.basis === 'ml' ? ['serving','ml','floz'] : ['serving','g','oz','lb']; }
function amtText(a, u){ return u === 'serving' ? `${fmtAmt(a)} serving${a === 1 ? '' : 's'}` : `${fmtAmt(a)} ${UNITS[u].l}`; }
function normalizeProduct(p){
  if (!p.size) { const m = String(p.serving?.label || '').match(/(\d+(?:\.\d+)?)\s*(g|ml)\b/i); if (m) { p.size = +m[1]; p.basis = m[2].toLowerCase(); } }
  if (p.size && !p.basis) p.basis = 'g';
  return p;
}
async function cacheThumb(url){
  try {
    const r = await fetch(url); if (!r.ok) return null;
    const bmp = await createImageBitmap(await r.blob()), s = Math.min(1, 160 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.78);
  } catch { return null; }
}
async function productThumb(p){ // stores a small copy so the photo shows offline
  if (p.thumb || !p.image) return p.thumb || null;
  const t = await cacheThumb(p.image); if (t) { p.thumb = t; await idb.put('products', p); } return t;
}
async function wikiThumb(term){
  try {
    if (!term) return null;
    const r = await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=240&generator=search&gsrlimit=1&gsrsearch=' + encodeURIComponent(term));
    if (!r.ok) return null;
    const pg = Object.values((await r.json()).query?.pages || {})[0], src = pg?.thumbnail?.source;
    return src ? (await cacheThumb(src)) || src : null;
  } catch { return null; }
}

class NetErr extends Error {}
class HttpErr extends Error { constructor(status, msg){ super(msg); this.status = status; } }
const transient = e => e instanceof NetErr || (e instanceof HttpErr && (e.status === 429 || e.status >= 500));
async function netFetch(url, opts){ try { return await fetch(url, opts); } catch { throw new NetErr('No connection'); } }

/* ---------- IndexedDB ---------- */
let dbp;
function db(){
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('chowlog', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      const e = d.createObjectStore('entries', {keyPath:'id'}); e.createIndex('date','date');
      d.createObjectStore('favorites', {keyPath:'id'});
      d.createObjectStore('products', {keyPath:'code'});
      d.createObjectStore('weights', {keyPath:'date'});
      d.createObjectStore('photos', {keyPath:'id'});
      d.createObjectStore('kv', {keyPath:'k'});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out;
    const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const idb = {
  get: (s,k) => tx(s,'readonly', st => st.get(k)),
  put: (s,v) => tx(s,'readwrite', st => st.put(v)),
  del: (s,k) => tx(s,'readwrite', st => st.delete(k)),
  all: s => tx(s,'readonly', st => st.getAll()),
  byDate: d => tx('entries','readonly', st => st.index('date').getAll(d)),
  dateRange: (lo,hi) => tx('entries','readonly', st => st.index('date').getAll(IDBKeyRange.bound(lo,hi))),
  replace: (s,arr) => tx(s,'readwrite', st => { st.clear(); (arr||[]).forEach(x => st.put(x)); }),
};

function mealForTime(t){
  const [H, M] = String(t).split(':').map(Number), m = H*60 + (M || 0);
  return m < 240 ? 'snack_eve' : m < 540 ? 'breakfast' : m < 630 ? 'snack_am' : m < 810 ? 'lunch' : m < 1020 ? 'snack_pm' : m < 1260 ? 'dinner' : 'snack_eve';
}

/* ---------- Calendar ---------- */
// Within ±5% of target = green. Under = yellow, over = red; each further 5% step away gets more intense (8 steps max).
function goalColor(cal, target){
  if (!cal || !target) return '';
  const r = cal / target;
  if (r >= 0.95 && r <= 1.05) return 'hsl(135,55%,40%)';
  const n = Math.min(8, Math.max(1, Math.ceil((r < 0.95 ? 0.95 - r : r - 1.05) / 0.05 - 1e-9))), t = (n - 1) / 7;
  return r < 0.95
    ? `hsl(${50 - t*12},${85 + t*15}%,${78 - t*30}%)`   // pale yellow → deep amber
    : `hsl(${4 - t*4},${70 + t*20}%,${78 - t*40}%)`;   // pale red → deep red
}
function weekStart(s){ const [y,m,d] = s.split('-').map(Number); return addDays(s, -new Date(y, m-1, d).getDay()); }
async function calendarHTML(){
  const t = todayStr(), month = calMonth || curDate.slice(0,7) + '-01';
  let days;
  if (!calOpen) { const ws = weekStart(curDate); days = Array.from({length:7}, (_, i) => addDays(ws, i)); }
  else {
    const [y, m] = month.split('-').map(Number), last = ymd(new Date(y, m, 0));
    days = []; for (let d = weekStart(month), end = addDays(weekStart(last), 6); d <= end; d = addDays(d, 1)) days.push(d);
  }
  const tot = {};
  (await idb.dateRange(days[0], days[days.length-1])).filter(e => e.status === 'ok').forEach(e => { tot[e.date] = (tot[e.date] || 0) + num(e.cal); });
  let head;
  if (calOpen) {
    const [y, m] = month.split('-').map(Number);
    const title = new Date(y, m-1, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'});
    head = `<div class="cal-mh"><button class="cal-nav" data-act="calmonth" data-n="-1" aria-label="Previous month">‹</button><b>${title}</b>
      <button class="cal-nav" data-act="calmonth" data-n="1" aria-label="Next month" ${month >= t.slice(0,7) + '-01' ? 'disabled' : ''}>›</button></div>`;
  } else {
    const a = days[0], b = days[6];
    head = `<div class="cal-mh"><button class="cal-nav" data-act="calweek" data-n="-7" aria-label="Previous week">‹</button><div class="cal-ttl"><b>${dayName(curDate)}</b><small>${shortD(a)} – ${shortD(b)}</small></div>
      <button class="cal-nav" data-act="calweek" data-n="7" aria-label="Next week" ${b >= t ? 'disabled' : ''}>›</button></div>`;
  }
  const wd = ['S','M','T','W','T','F','S'].map(x => `<div class="cal-wd">${x}</div>`).join('');
  const cells = days.map(d => {
    const c = tot[d], cls = ['cal-d', d === curDate ? 'sel' : '', d === t ? 'today' : '', calOpen && d.slice(0,7) !== month.slice(0,7) ? 'out' : ''].join(' ');
    return `<button class="${cls}" data-act="pickday" data-d="${d}" ${d > t ? 'disabled' : ''} aria-label="${shortD(d)}${c ? ', ' + r0(c) + ' calories' : ''}">
      <b>${+d.slice(8)}</b><i style="background:${goalColor(c, S.cal) || 'transparent'}"></i></button>`;
  }).join('');
  return `<div class="card cal">${head}<div class="cal-grid">${wd}${cells}</div>
    <div class="cal-foot"><span><span class="dot" style="background:${goalColor(0.8, 1)}"></span>Under<span class="dot" style="background:${goalColor(1, 1)}"></span>On target<span class="dot" style="background:${goalColor(1.2, 1)}"></span>Over</span>
    <span>${curDate !== t ? '<button class="link" data-act="pickday" data-d="' + t + '" style="padding:4px 8px">Today</button>' : ''}<button class="link" data-act="caltoggle" style="padding:4px 8px">${calOpen ? 'Show week ▴' : 'Show month ▾'}</button></span></div></div>`;
}

function macro(label, v, t, k){
  const pct = t ? Math.min(100, v/t*100) : 0;
  return `<div class="mac"><small>${label}</small><b>${r0(v)}<span> / ${t}g</span></b><div class="mbar ${v>t?'over':''}"><i class="k-${k}" style="width:${pct}%"></i></div></div>`;
}
function entryRow(e){
  const st = e.status === 'pending' ? `<span class="tag pend">Queued for ${({photo:'analysis', label:'reading', barcode:'lookup', text:'estimate'})[e.pending?.type] || 'processing'}</span>`
           : e.status === 'error' ? `<span class="tag err">Needs attention</span>` : '';
  return `<div class="swipe" data-swipe="entry" data-id="${e.id}"><div class="swipe-bg">Delete</div><button class="row" data-act="entry" data-id="${e.id}">${e.thumb ? `<img src="${e.thumb}" alt="">` : `<div class="ic">${ICON[e.source]||'•'}</div>`}
    <div class="rm"><div class="rn">${esc(e.name)}</div><div class="rd">${fmtTime(entTime(e))} · ${st || `P ${r0(e.p)} · C ${r0(e.c)} · F ${r0(e.f)}`}</div></div>
    <div class="rc">${e.status === 'ok' ? r0(e.cal) : ''}</div></button></div>`;

async function renderToday(){
  const es = (await idb.byDate(curDate)).sort((a, b) => byTime(b, a)); // newest first within each meal
  const t = totals(es.filter(e => e.status === 'ok'));
  const left = S.cal - t.cal, filled = Math.round(Math.min(t.cal, S.cal) / S.cal * 20);
  const segs = Array.from({length:20}, (_,i) => `<i class="${left < 0 ? 'ov' : i < filled ? 'on' : ''}"></i>`).join('');
  let h = await calendarHTML() + `<div class="card gauge">
    <div><span class="num ${left<0?'over':''}">${Math.abs(r0(left)).toLocaleString()}</span><span class="lbl">${left < 0 ? 'calories over' : 'calories left'}</span></div>
    <div class="sub">${r0(t.cal).toLocaleString()} eaten of ${S.cal.toLocaleString()}</div>
    <div class="segs">${segs}</div>
    <div class="macros">${macro('Protein',t.p,S.p,'p')}${macro('Carbs',t.c,S.c,'c')}${macro('Fat',t.f,S.f,'f')}</div>
  </div>`;
  for (const m of MEALS){
    const list = es.filter(e => e.meal === m), mt = totals(list.filter(e => e.status === 'ok'));
    if (SNACKS.has(m) && !list.length) continue; // snack sections appear only once something is logged in them
    h += `<div class="card meal"><div class="mh"><b>${MEAL_LABEL[m]}</b><span>${r0(mt.cal)} cal</span><button class="mini" data-act="addto" data-meal="${m}">Add</button></div>`;
    h += list.length ? list.map(entryRow).join('') : `<div class="empty">Nothing logged yet.</div>`;
    if (list.filter(e => e.status === 'ok').length > 1) h += `<button class="link" data-act="savemeal" data-meal="${m}">Save as a meal</button>`;
    h += `</div>`;
  }
  $('#tab-today').innerHTML = h;
}

async function recentItems(){
  const all = (await idb.all('entries')).filter(e => e.status === 'ok').sort((a,b) => (b.created || b.ts) - (a.created || a.ts));
  const seen = new Set(), out = [];
  for (const e of all){ const k = e.name.toLowerCase(); if (seen.has(k)) continue; seen.add(k); out.push(e); if (out.length >= 15) break; }
  return out;
}

function loadImg(file){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
function toJpeg(img, max, q){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q);
}

// Reads when a photo was taken from its EXIF data (used for gallery picks).
async function exifDate(file){
  try {
    const v = new DataView(await file.slice(0, 256*1024).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o + 10 < v.byteLength){
      const marker = v.getUint16(o), len = v.getUint16(o + 2);
      if (marker === 0xFFE1 && v.getUint32(o + 4) === 0x45786966){
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const u16 = p => v.getUint16(t + p, le), u32 = p => v.getUint32(t + p, le);
        const ifd = off => { const n = u16(off), tags = {}; for (let i = 0; i < n; i++){ const e = off + 2 + i*12; tags[u16(e)] = {count:u32(e + 4), val:u32(e + 8)}; } return tags; };
        const str = tg => { if (!tg) return null; let s = ''; for (let i = 0; i < tg.count - 1; i++) s += String.fromCharCode(v.getUint8(t + tg.val + i)); return s; };
        const i0 = ifd(u32(4)); let s = null;
        if (i0[0x8769]) { const ex = ifd(i0[0x8769].val); s = str(ex[0x9003]) || str(ex[0x9004]); }
        s = s || str(i0[0x0132]);
        const m = s && s.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/);
        return m ? {date:`${m[1]}-${m[2]}-${m[3]}`, time:`${m[4]}:${m[5]}`} : null;
      }
      if ((marker & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch {}
  return null;
}

const SYS = `You estimate nutrition from meal photos for a calorie tracker. Identify each distinct food or drink, estimate its portion, and estimate calories and macronutrients. Use the user's note when given; it overrides what you see. Respond with ONLY a JSON object, no markdown, in this shape:
{"meal_name":"short name for the whole meal","items":[{"name":"food","portion":"e.g. 1 cup","calories":0,"protein_g":0,"carbs_g":0,"fat_g":0}],"confidence":"low|medium|high","notes":"one short sentence on assumptions"}
If no food is visible, return an empty items array.`;

async function callClaude(content, max = 1500, system, tools){
  const r = await netFetch('https://api.anthropic.com/v1/messages', {method:'POST',
    headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.model, max_tokens:max, ...(system ? {system} : {}), ...(tools ? {tools} : {}), messages:[{role:'user', content}]})});
  if (!r.ok){ let m = ''; try { m = (await r.json()).error?.message || ''; } catch {} throw new HttpErr(r.status, m || 'API error ' + r.status); }
  const j = await r.json();
  return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
}
function parseJSON(t){
  // Prefer the last top-level answer object (web-search replies can include commentary before it).
  let s = -1; for (const m of t.matchAll(/\{\s*"(meal_name|product_name|items)"/g)) s = m.index;
  if (s < 0) s = t.indexOf('{'); const e = t.lastIndexOf('}'); if (s < 0 || e < s) throw new Error('The estimate came back in an unreadable format. Tap Try now.'); return JSON.parse(t.slice(s, e+1)); }

async function resolvePhoto(e){
  const ph = await idb.get('photos', e.id);
  if (!ph) throw new Error('The original photo is missing. Enter this one manually.');
  const note = e.pending.note ? ` Note from the user: ${e.pending.note}` : '';
  const txt = await callClaude([
    {type:'image', source:{type:'base64', media_type:'image/jpeg', data:ph.data.split(',')[1]}},
    {type:'text', text:'Estimate the nutrition for this meal.' + note}], 1500, SYS);
  applyEstimate(e, parseJSON(txt), 'No food was recognized in this photo. Add a note or enter it manually.');
  await idb.put('entries', e); await idb.del('photos', e.id);
}
function applyEstimate(e, d, emptyMsg){
  const items = (d.items || []).map(i => ({name:String(i.name || 'Item'), portion:i.portion ? String(i.portion) : '',
    cal:r1(i.calories), p:r1(i.protein_g), c:r1(i.carbs_g), f:r1(i.fat_g)}));
  if (!items.length) throw new Error(emptyMsg);
  const t = totals(items);

const OFF_FIELDS = 'code,product_name,brands,nutriments,serving_size,serving_quantity,serving_quantity_unit,image_front_small_url,image_front_thumb_url';
function normalizeOFF(p, code){
  const n = p.nutriments || {};
  const kcal100 = n['energy-kcal_100g'] ?? (n['energy_100g'] != null ? n['energy_100g'] / 4.184 : null);
  const sq = num(p.serving_quantity) || null;
  const liquid = /ml/i.test(p.serving_quantity_unit || '') || /\d\s*ml\b|fl\.?\s?oz/i.test(p.serving_size || '');
  let serving, size = null;
  if (n['energy-kcal_serving'] != null) { serving = {label:p.serving_size || '1 serving', cal:num(n['energy-kcal_serving']), p:num(n.proteins_serving), c:num(n.carbohydrates_serving), f:num(n.fat_serving)}; size = sq; }
  else if (kcal100 != null) { const g = sq || 100; serving = {label:p.serving_size || g + (liquid ? ' ml' : ' g'), cal:num(kcal100)*g/100, p:num(n.proteins_100g)*g/100, c:num(n.carbohydrates_100g)*g/100, f:num(n.fat_100g)*g/100}; size = g; }
  else return null;
  const brand = (p.brands || '').split(',')[0].trim();
  const pn = String(p.product_name || '').trim();
  const name = (brand && !pn.toLowerCase().startsWith(brand.toLowerCase()) ? [brand, pn] : [pn || brand]).filter(Boolean).join(' ') || 'Product ' + code;
  return normalizeProduct({code:String(code), name, serving, size, basis:size ? (liquid ? 'ml' : 'g') : undefined, image:p.image_front_small_url || p.image_front_thumb_url || null, ts:Date.now()});
}
async function fetchOFF(code){
  const r = await netFetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  if (r.status === 404) return null;
  if (!r.ok) throw new HttpErr(r.status, 'Food database error ' + r.status);
  const j = await r.json(); if (j.status !== 1 || !j.product) return null;
  return normalizeOFF(j.product, code);
}

let qRunning = false;
async function processQueue(force){

    for (const e of pend){
      const t = e.pending?.type;
      if (t !== 'barcode' && !S.apiKey) continue;
      try { await (t === 'barcode' ? resolveBarcode(e) : t === 'label' ? resolveLabel(e) : t === 'text' ? resolveText(e) : resolvePhoto(e)); did++; }
      catch (err) {

        e.status = 'error'; e.error = err.message || String(err); await idb.put('entries', e);
      }
    }
  } finally { qRunning = false; }
  if (did) toast(`${did} queued ${did === 1 ? 'item' : 'items'} processed`);

}

/* ---------- Trends ---------- */
function barChart(days, target, key, cls){
  const W = 340, H = 150, pl = 30, pb = 16, n = days.length;
  const max = Math.max(target * 1.25, ...days.map(d => d[key]), 1), bw = (W - pl) / n;
  const Y = v => H - pb - v / max * (H - pb - 6);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Daily ${key === 'cal' ? 'calories' : 'protein'}">`;
  days.forEach((d, i) => { const y = Y(d[key]); s += `<rect x="${pl + i*bw + bw*0.15}" y="${y}" width="${Math.max(1, bw*0.7)}" height="${H - pb - y}" rx="2" ${cls === 'b-ok' ? `style="fill:${goalColor(d[key], target)}"` : `class="${cls}"`}/>`; });
  const ty = Y(target);
  s += `<line x1="${pl}" x2="${W}" y1="${ty}" y2="${ty}" class="tline"/><text x="0" y="${ty + 3}" class="tlab">${target}</text>`;
  s += `<text x="${pl}" y="${H - 2}" class="tlab">${shortD(days[0].d)}</text><text x="${W}" y="${H - 2}" class="tlab" text-anchor="end">${shortD(days[n-1].d)}</text>`;
  return s + '</svg>';
}
function lineChart(pts){
  if (pts.length < 2) return `<div class="empty">Log at least two weigh-ins to see a trend.</div>`;
  const W = 340, H = 140, pl = 34, pb = 16, pt = 8, ys = pts.map(p => p.lb);
  let mn = Math.min(...ys), mx = Math.max(...ys); if (mx - mn < 2){ mn -= 1; mx += 1; }
  const t0 = dnum(pts[0].date), span = Math.max(1, dnum(pts[pts.length-1].date) - t0);
  const X = d => pl + (dnum(d) - t0) / span * (W - pl - 6), Y = v => pt + (mx - v) / (mx - mn) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Weight trend">`;
  s += `<text x="0" y="${Y(mx) + 4}" class="tlab">${r1(mx)}</text><text x="0" y="${Y(mn) + 4}" class="tlab">${r1(mn)}</text>`;
  s += `<polyline class="wline" points="${pts.map(p => X(p.date) + ',' + Y(p.lb)).join(' ')}"/>`;
  s += pts.map(p => `<circle cx="${X(p.date)}" cy="${Y(p.lb)}" r="3" class="wdot"/>`).join('');
  s += `<text x="${pl}" y="${H - 2}" class="tlab">${shortD(pts[0].date)}</text><text x="${W - 6}" y="${H - 2}" class="tlab" text-anchor="end">${shortD(pts[pts.length-1].date)}</text>`;
  return s + '</svg>';
}

  const logged = days.filter(x => x.cal > 0), avg = k => logged.length ? logged.reduce((a,x) => a + x[k], 0) / logged.length : 0;
  const ws = (await idb.all('weights')).sort((a,b) => a.date < b.date ? -1 : 1);
  let wpts = ws.filter(w => w.date >= start); if (wpts.length < 2) wpts = ws.slice(-10);
  const latest = ws[ws.length - 1], change = wpts.length > 1 ? wpts[wpts.length-1].lb - wpts[0].lb : null;
  $('#tab-trends').innerHTML = `<div class="chips">${[7,30,90].map(n => `<button class="chip ${n===trendDays?'on':''}" data-act="range" data-n="${n}">${n} days</button>`).join('')}</div>
  <div class="card"><div class="ctitle"><b>Calories</b><span>green = within 5% of target</span></div>${barChart(days, S.cal, 'cal', 'b-ok')}
    <div class="stats">

      <div class="stat"><small>Average fat</small><b>${r0(avg('f'))}<span> / ${S.f} g</span></b></div>
    </div></div>
  <div class="card"><div class="ctitle"><b>Protein</b><span>avg ${r0(avg('p'))} of ${S.p} g</span></div>${barChart(days, S.p, 'p', 'b-p')}</div>
  <div class="card"><div class="ctitle"><b>Weight</b><span>${latest ? `latest ${r1(latest.lb)} lb` : ''}${change != null ? ` · ${change > 0 ? '+' : ''}${r1(change)} lb` : ''}</span></div>
    ${lineChart(wpts)}
    <div class="grid4" style="margin-top:12px"><label>Today's weight (lb)<input id="w_in" type="number" inputmode="decimal" step="0.1" value="${ws.find(w => w.date === end)?.lb ?? ''}"></label>
    <div class="btns" style="margin-top:20px"><button class="primary" id="w_go">Log weight</button></div></div></div>`;
  $('#w_go').onclick = async () => { const v = num($('#w_in').value); if (!v) return toast('Enter your weight'); await idb.put('weights', {date:end, lb:r1(v)}); toast('Weight logged'); renderTrends(); };
}

/* ---------- Settings ---------- */
function renderSettings(){
  $('#tab-settings').innerHTML = `
  <div class="card"><h2>Daily targets</h2>
    <div class="grid4">${numF('t_cal','Calories',S.cal)}${numF('t_p','Protein (g)',S.p)}${numF('t_c','Carbs (g)',S.c)}${numF('t_f','Fat (g)',S.f)}</div>
    <p class="hint" id="t_chk"></p>
    <div class="btns"><button class="primary" id="t_save">Save targets</button></div></div>
  <div class="card"><h2>AI estimates</h2>
    <p class="hint">Photos, labels and descriptions are analyzed by Claude using your own Anthropic API key. The key is stored only on this phone.</p>
    <label>API key<input id="ai_key" type="password" autocomplete="off" value="${esc(S.apiKey)}" placeholder="sk-ant-…"></label>
    <label>Model<input id="ai_model" value="${esc(S.model)}"></label>
    <div class="btns"><button id="ai_test">Test connection</button><button class="primary" id="ai_save">Save</button></div></div>
  <div class="card"><h2>Time format</h2>
    <label>Show times as<select id="tf_sel">
      <option value="12" ${S.timeFmt !== '24' ? 'selected' : ''}>12-hour (7:15 PM)</option>
      <option value="24" ${S.timeFmt === '24' ? 'selected' : ''}>24-hour (19:15)</option></select></label>
    <p class="hint">Used for every time shown in the app and for typing times when you log or edit food.</p></div>
  <div class="card"><h2>Backup</h2>
    <p class="hint">Your log lives only on this phone. Export a backup now and then, and import it if you switch phones.</p>
    <div class="btns"><button id="ex_go">Export backup</button><button id="im_go">Import backup</button></div></div>
  <div class="card"><h2>Erase</h2><div class="btns"><button class="danger" id="wipe">Erase all data</button></div></div>`;
  const chk = () => { const k = 4*num($('#t_p').value) + 4*num($('#t_c').value) + 9*num($('#t_f').value); $('#t_chk').textContent = `Your macros add up to ${r0(k).toLocaleString()} calories.`; };
  ['t_p','t_c','t_f'].forEach(id => $('#'+id).oninput = chk); chk();
  $('#t_save').onclick = async () => { for (const k of ['cal','p','c','f']) S[k] = r0($('#t_'+k).value) || S[k]; await saveSettings(); toast('Targets saved'); };
  $('#ai_save').onclick = async () => { S.apiKey = $('#ai_key').value.trim(); S.model = $('#ai_model').value.trim() || DEFAULTS.model; await saveSettings(); toast('Saved'); processQueue(); };
  $('#ai_test').onclick = async () => {
    S.apiKey = $('#ai_key').value.trim(); S.model = $('#ai_model').value.trim() || DEFAULTS.model;
    if (!S.apiKey) return toast('Enter your API key first');
    toast('Testing…');
    try { await callClaude('Reply with OK.', 10); await saveSettings(); toast('Connected. Key saved.'); }
    catch (e) { toast(e instanceof NetErr ? 'No connection right now' : 'Failed: ' + e.message); }
  };
  $('#tf_sel').onchange = async ev => { S.timeFmt = ev.target.value; await saveSettings(); toast('Time format saved'); renderSettings(); };
  $('#ex_go').onclick = exportData;
  $('#im_go').onclick = () => $('#importInput').click();
  $('#wipe').onclick = async () => {
    if (!confirm('Erase every entry, favorite, weight and setting on this phone? This cannot be undone.')) return;
    for (const s of ['entries','favorites','products','weights','photos','kv']) await idb.replace(s, []);
    await loadSettings(); toast('All data erased'); refresh();
  };
}
const STORES = ['entries','favorites','products','weights','photos','kv'];
async function exportData(){
  const out = {app:'chowlog', v:1, exported:new Date().toISOString()};
  for (const s of STORES) out[s] = await idb.all(s);
  out.kv = out.kv.map(r => r.k === 'settings' ? {...r, v:{...r.v, apiKey:''}} : r); // never export the key
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], {type:'application/json'}));
  a.download = `chowlog-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('Backup exported');
}
$('#importInput').onchange = async ev => {
  const file = ev.target.files[0]; ev.target.value = ''; if (!file) return;
  try {
    const d = JSON.parse(await file.text()); if (d.app !== 'chowlog') throw new Error();
    if (!confirm('Replace everything on this phone with this backup?')) return;
    const key = S.apiKey;
    for (const s of STORES) await idb.replace(s, d[s] || []);
    await loadSettings(); if (!S.apiKey && key){ S.apiKey = key; await saveSettings(); }
    toast('Backup imported'); refresh();
  } catch { toast("That file isn't a ChowLog backup"); }
};

/* ---------- wiring ---------- */
/* ---------- Swipe left to delete ---------- */
let sw = null, swipedAt = 0, swipedWrap = null;
/* ---------- Long press to edit ---------- */
let lp = null, pressedAt = 0, pressedRow = null;
document.addEventListener('pointerdown', ev => {
  const row = ev.target.closest('.row[data-act]'); if (!row || ev.button > 0 || ev.target.closest('.x')) return;
  lp = {row, x:ev.clientX, y:ev.clientY, t:setTimeout(() => {
    row.classList.remove('pressing'); lp = null; pressedAt = Date.now(); pressedRow = row; sw = null;
    navigator.vibrate?.(30); longPress(row);
  }, 500)};
  row.classList.add('pressing');
}, true);
const cancelLP = () => { if (lp) { clearTimeout(lp.t); lp.row.classList.remove('pressing'); lp = null; } };
document.addEventListener('pointermove', ev => { if (lp && Math.hypot(ev.clientX - lp.x, ev.clientY - lp.y) > 10) cancelLP(); }, true);
document.addEventListener('pointerup', cancelLP, true);
document.addEventListener('pointercancel', cancelLP, true);
document.addEventListener('contextmenu', ev => { if (ev.target.closest('.row')) ev.preventDefault(); });
function longPress(row){
  const d = row.dataset;
  switch (d.act){
    case 'entry': entrySheet(d.id); break;
    case 'usefav': favSheet(d.id); break;
    case 'userecent': { const e = recentCache[+d.i]; if (e) manualSheet({title:'Edit, then log', name:e.name, cal:r1(e.cal), p:r1(e.p), c:r1(e.c), f:r1(e.f), thumb:e.thumb}); break; }
    case 'bitem': bItemSheet(+d.i); break;
    case 'pickprod': row.click(); break;
  }
}
async function favSheet(id){
  const f = await idb.get('favorites', id); if (!f) return;
  if (f.items) { builder = {id:f.id, name:f.name, items:f.items.map(i => ({...i})), recipe:!!f.recipe, servings:f.servings}; showTab('add'); return; } // saved meals open in the meal editor
  sheet(`${f.thumb ? `<img class="pimg" src="${f.thumb}" alt="">` : ''}<h2>Edit favorite</h2>
    <label style="clear:both">Name<input id="fv_name" value="${esc(f.name)}"></label>
    <div class="grid4">${numF('fv_cal','Calories',r1(f.cal))}${numF('fv_p','Protein (g)',r1(f.p))}${numF('fv_c','Carbs (g)',r1(f.c))}${numF('fv_f','Fat (g)',r1(f.f))}</div>
    <div class="btns"><button class="danger" id="fv_del">Delete</button><button id="fv_log">Save and log</button><button class="primary" id="fv_save">Save</button></div>`);
  const save = async () => { const v = readMacros('fv_'); if (!v.name) { toast('Add a name first'); return false; } Object.assign(f, v); await idb.put('favorites', f); return true; };
  $('#fv_save').onclick = async () => { if (await save()) { closeSheet(); toast('Favorite saved'); refresh(); } };
  $('#fv_log').onclick = async () => { if (await save()) { closeSheet(); await useFav(f.id); } };
  $('#fv_del').onclick = async () => { await idb.del('favorites', f.id); closeSheet(); refresh(); toast(`Deleted ${f.name.slice(0, 30)}`, async () => { await idb.put('favorites', f); refresh(); }); };
}

document.addEventListener('pointerdown', ev => {
  const wrap = ev.target.closest('.swipe'); if (!wrap || ev.button > 0 || ev.target.closest('.x')) return;
  sw = {wrap, row:wrap.querySelector('.row'), x0:ev.clientX, y0:ev.clientY, dx:0, active:false, pid:ev.pointerId};
});
document.addEventListener('pointermove', ev => {
  if (!sw || ev.pointerId !== sw.pid) return;
  const dx = ev.clientX - sw.x0, dy = ev.clientY - sw.y0;
  if (!sw.active){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; } // vertical scroll wins
    if (Math.abs(dx) < 10) return;
    sw.active = true; sw.row.style.transition = 'none';
  }
  sw.dx = Math.min(0, dx); sw.row.style.transform = `translateX(${sw.dx}px)`;
  sw.wrap.classList.toggle('arm', -sw.dx > sw.wrap.offsetWidth * 0.35);
});
function endSwipe(){
  if (!sw) return; const s = sw; sw = null; if (!s.active) return;
  swipedAt = Date.now(); swipedWrap = s.wrap; const w = s.wrap.offsetWidth;
  s.row.style.transition = 'transform .18s ease';
  if (-s.dx > w * 0.35) { s.row.style.transform = `translateX(${-w}px)`; navigator.vibrate?.(20); setTimeout(() => swipeDelete(s.wrap), 170); }
  else { s.row.style.transform = ''; s.wrap.classList.remove('arm'); }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);
async function swipeDelete(wrap){
  const kind = wrap.dataset.swipe;
  if (kind === 'entry'){
    const e = await idb.get('entries', wrap.dataset.id), ph = await idb.get('photos', wrap.dataset.id); if (!e) return refresh();
    await idb.del('entries', e.id); await idb.del('photos', e.id); refresh();
    toast(`Deleted ${e.name.slice(0, 30)}`, async () => { await idb.put('entries', e); if (ph) await idb.put('photos', ph); refresh(); });
  } else if (kind === 'fav'){
    const f = await idb.get('favorites', wrap.dataset.id); if (!f) return refresh();
    await idb.del('favorites', f.id); refresh();
    toast(`Deleted ${f.name.slice(0, 30)}`, async () => { await idb.put('favorites', f); refresh(); });
  } else if (kind === 'bitem' && builder){
    const k = +wrap.dataset.i, [it] = builder.items.splice(k, 1); renderAdd();
    if (it) toast(`Removed ${it.name.slice(0, 30)}`, () => { if (builder) { builder.items.splice(k, 0, it); renderAdd(); } });
  }
}

document.addEventListener('click', ev => {
  // the tap that ends a swipe or long press on a row isn't a real tap
  if ((Date.now() - swipedAt < 400 && ev.target.closest('.swipe') === swipedWrap) || (Date.now() - pressedAt < 700 && ev.target.closest('.row') === pressedRow)) { ev.preventDefault(); return; }
  const el = ev.target.closest('[data-act],[data-tab]'); if (!el) return;
  if (el.dataset.tab) return showTab(el.dataset.tab);
  const d = el.dataset;
  switch (d.act){
    case 'close': closeSheet(); break;
    case 'entry': entrySheet(d.id); break;
    case 'addto': curMeal = d.meal; if (curDate !== todayStr()) logDate = curDate; showTab('add'); break;
    case 'meal': curMeal = d.meal; renderAdd(); break;
    case 'photo': choosePhoto({type:'meal'}); break;
    case 'label': choosePhoto({type:'label'}); break;
    case 'scan': scanSheet(); break;
    case 'manual': manualSheet(); break;
    case 'describe': describeSheet(); break;
    case 'search': searchSheet(); break;
    case 'pickprod': { const pr = searchCache[d.src]?.[+d.i]; if (pr) { if (d.src === 'remote') idb.put('products', pr); servingSheet(pr, 'search'); } break; }
    case 'frac': { const inp = $('#' + el.parentNode.dataset.for); if (inp) { inp.value = d.v; inp.dispatchEvent(new Event('input')); } break; }
    case 'newmeal': builder = {name:'', items:[]}; renderAdd(); window.scrollTo(0,0); break;
    case 'newrecipe': builder = {name:'', items:[], recipe:true, servings:4}; renderAdd(); window.scrollTo(0,0); break;
    case 'editmeal': idb.get('favorites', d.id).then(f => { if (!f) return; builder = {id:f.id, name:f.name, items:f.items.map(i => ({...i})), recipe:!!f.recipe, servings:f.servings}; renderAdd(); window.scrollTo(0,0); }); break;
    case 'bitem': bItemSheet(+d.i); break;
    case 'usefav': useFav(d.id); break;
    case 'delfav': delFav(d.id); break;
    case 'userecent': useRecent(+d.i); break;
    case 'savemeal': saveMealSheet(d.meal); break;
    case 'range': trendDays = +d.n; renderTrends(); break;
    case 'pickday': if (d.d <= todayStr()) { curDate = d.d; calOpen = false; calMonth = null; refresh(); } break;
    case 'caltoggle': calOpen = !calOpen; calMonth = calOpen ? curDate.slice(0,7) + '-01' : null; refresh(); break;
    case 'calweek': { const n = addDays(curDate, +d.n); curDate = n > todayStr() ? todayStr() : n; refresh(); break; }
    case 'calmonth': { const [y, m] = (calMonth || curDate.slice(0,7) + '-01').split('-').map(Number); calMonth = ymd(new Date(y, m-1 + (+d.n), 1)); refresh(); break; }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeSheet();
  if (ev.key === 'Enter' && ev.target.matches('[role="button"][data-act]')) ev.target.click();
});

(async () => {
  await loadSettings();
  try { // one-time move of entries from the old single "Snacks" section into morning/afternoon/evening snacks
    for (const e of (await idb.all('entries')).filter(e => e.meal === 'snack')) { const m = mealForTime(entTime(e)); e.meal = SNACKS.has(m) ? m : {breakfast:'snack_am', lunch:'snack_pm', dinner:'snack_eve'}[m]; await idb.put('entries', e); }
  } catch {}
  try { await navigator.storage?.persist?.(); } catch {}
  showTab('today');
  processQueue();
  if ('serviceWorker' in navigator) {
    // When a new version installs, reload once so it shows immediately instead of on the next launch.
    const hadController = !!navigator.serviceWorker.controller; let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return; reloading = true;
      toast('Updating ChowLog…'); setTimeout(() => location.reload(), 600);
    });
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
